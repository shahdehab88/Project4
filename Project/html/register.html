<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"/>
    <link rel="stylesheet" href="../css/register.css">
    <title>Register</title>

</head>
<body>

  <section id="signUp" class="sign-up w-100 py-5 px-5 position-relative">
     <div class="container text-center py-5 px-5 rounded-4">
       <div class="welcome-image w-75 m-auto">
          <img src="../images/Welcome.png" class="w-50 py-4" alt="Join the world's largest community" title="Join the world's largest community">
        </div>
        <form class="sign-in-form w-75 mx-auto">
          <input id="nameInput" type="text" placeholder="Please Enter Your Name" class="form-control my-2">
          <div class="alert alert-danger d-none" id="nameAlert">Please Enter Valid Name ex:abdallahMu</div>
          <input id="emailInput" type="email" placeholder="Please Enter Your Email" class="form-control my-2">
          <div class="alert alert-danger d-none" id="emailAlert">Please Enter Valid Email <span class="text-muted">Ex : example@gmial.com</span></div>
          <input id="ageInput" type="number" placeholder="Please Enter Your Age" class="form-control my-2">
          <div class="alert alert-danger d-none" id="ageAlert">Age Must Be From 10 to 80</div>
          <input id="phoneInput" type="tel" placeholder="Please Enter Your Phone" class="form-control my-2">           
          <div class="alert alert-danger d-none" id="phoneAlert">Must Add An Egyption Number</div>
          <input id="passwordInput" type="password" placeholder="Please Enter Your password" class="form-control my-2">
          <div class="alert alert-danger d-none" id="passwordAlert">Password Must Have At Least 1 (UpperCase , LowerCase , Specialchar , Number)</div>
          <div class="loader mx-auto d-none" id="loader"></div>
          <p id="msg">DONE</p>
          <button class="btn btn-success" type="button" onclick="addUser()">Submit</button>          

          

        </form>
      </div>
      <div class="login-success position-absolute justify-content-center align-items-center d-none">
        <div class="box bg-white rounded-4 p-3 w-40 text-center">
          <img src="" alt="Registeration success" class="w-75 py-3">
          <p>Congratulation, Your account has been successfully created.</p>
          <a class="btn btn-sign-in" href="../html/sign-in.html">sign-in</a>
        </div>
      </div>

  </section>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  <script src="../js/register.js"></script>


    
</body>
</html>

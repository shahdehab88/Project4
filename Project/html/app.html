<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"/>
    <link rel="stylesheet" href="../css/app.css">
    <title>to do list</title>


</head>
<body>
    
    <div id="loading-Screen" class="d-flex justify-content-center align-items-center">
        <div class="loader"></div>
    </div>
    
    <div class="ss">

        <div class="dede d-flex justify-content-center align-items-center ">
            <input type="checkbox" class="form-check-input my-4 d-none" name="" id="toggleTheme" >
            <label for="toggleTheme">
                <i class="fa-solid fa-moon"></i>
            </label> 
        </div>


          <div class="logout">
            <a href="../html/sign-in.html" class="fa-solid fa-right-from-bracket" style="color: white;"></a>

          </div>


          <header class="shadow-lg fixed-top">
                <div class="container d-flex justify-content-between align-items-center gap-3 p-3">
                    <h1 class="h2 m-0 text-capitalize fw-bold">
                        <a href="../html/register.html" class="text-decoration-none" style="color: black;">Daily Task</a>
                    </h1>
                    <div class="loaderBtn d-none"></div>
               </div>
            </header>
      
            <main>
                <nav class="my-5">
              

                    <div class="container d-flex justify-content-center align-items-center">
                      <div class="line "></div>
                       <h2 class="h5 m-0 fw-bold ">
                         <i class="fa-regular fa-star"></i>All of tasks
                      </h2>
                      <div class="line"></div>
                    </div>
                </nav>

                <div class="container">
                    <input type="text" id="noteTitle" placeholder="Add Note Title" class="form-control my-2">
                    <textarea id="noteBody" placeholder="Add Note Body" rows="5" class="form-control my-2"></textarea>
               </div>
            
               <button id="newTask" class="btn btn-new-task mx-auto d-flex align-items-center mb-5 fw-semibold bg-warning rounded" onclick="addNote()"> 
                    <i class="fa-solid fa-file-circle-plus me-1 fs-5"></i> Add New Task
               </button>
               <button id="UpadteNote" class="btn btn-new-task mx-auto d-none align-items-center mb-5 fw-semibold" onclick="updatenote()">
                    <i class="bi bi-file-earmark-plus me-1 fs-5"></i> Update Note
               </button>
      
               <div class="container columns pb-5">
                   <div class="row g-3 align-items-start" id="rowData"></div>
               </div>
            </main>
      
          
          <footer class="fixed-bottom">
            <div class="container py-3 text-center">
              <p class="copyright m-0 fs-6 fw-bold">
                Made with <i class="fa-solid fa-heart fa-beat mx-2 "style="color: red;"></i> by
                <a href="#" class="text-decoration-none fw-normal d-inline-block" style="color: black;"> SHAHD EHAB </a>
              </p>
            </div>
          </footer>
   </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="../js/app.js"></script>
  

</body>
</html>
